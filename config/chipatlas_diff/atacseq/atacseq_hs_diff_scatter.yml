# ChIP-Atlas Diff Analysis scatter config for HS-related ATAC-seq pairs
# (pair1–pair8, pair10–pair11 active; pair9 commented out)
# See notebooks/00_metadata/12_8_metadata_atacseq.ipynb
#
# pair9 (GSE267931) disabled for genome=hg38:
#   SRX24613861 is on ChIP-Atlas (https://chip-atlas.org/view?id=SRX24613861)
#   but hg38 bigWig/BED is missing (hg19 only in experimentList.tab).
#   Diff Analysis with hg38 fails at SRX24613861.bw download on the server.
#   Workarounds: use genome=hg19 for pair9, or drop SRX24613861 from dataset_A.
#
# Run (collect outputs with --outdir):
#   cwltool --cachedir ./tmp/ --outdir ./out/ChIP-Atlas_diff/ATACseq/job/ \
#     Workflow/chip_atlas_diff_scatter.cwl \
#     config/chipatlas_diff/atacseq/atacseq_hs_diff_scatter.yml

