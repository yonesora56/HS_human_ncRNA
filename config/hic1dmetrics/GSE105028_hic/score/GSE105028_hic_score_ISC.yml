# GSE105028 Hi-C (merged) — two-sample score, HS vs Ctrl, ISC
# Scatter over chr1-22 and chrX. Matrix lists must stay in the same order.
# Resolution 5000 bp, KR dumps from:
#   out/h1d/GSE105028_hic/HS_dump/
#   out/h1d/GSE105028_hic/Ctrl_dump/
#
# Copy this file per metric. Change only:
#   metric      ISC | CIC | SSC | deltaDLR | CD | IESC | IASC | DRF
#   parameter   300000              ISC, CIC, SSC, IASC, IESC (window bp)
#               3000000             deltaDLR (local distance bp)
#               pearson             CD (correlation method)
#               200000,5000000      DRF (start,end distance bp)
#   --outdir    match the metric name, e.g. .../score/CIC/
#
# Run:
#   cwltool --outdir ./out/h1d/GSE105028_hic/score/ISC/ \
#     ./Workflow/hic1dmetrics_score_scatter.cwl \
#     ./config/hic1dmetrics/GSE105028_hic/score/GSE105028_hic_score_ISC.yml

metric: ISC
parameter: "300000"
resolution: 5000

score_script:
  class: File
  location: ../../../../scripts/hic1dmetrics_score.py

chromosomes:
  - chr1
  - chr2
  - chr3
  - chr4
  - chr5
  - chr6
  - chr7
  - chr8
  - chr9
  - chr10
  - chr11
  - chr12
  - chr13
  - chr14
  - chr15
  - chr16
  - chr17
  - chr18
  - chr19
  - chr20
  - chr21
  - chr22
  - chrX

