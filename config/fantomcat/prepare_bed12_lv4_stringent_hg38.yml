# Rewrite CrossMap BED12 so bed2gtf 2.0.0 can parse it
#
# Run:
#   cwltool --outdir ./Data/Database/FANTOM/FANTOM-CAT \
#     ./Tools/fantomcat/prepare_bed12_for_bed2gtf.cwl \
#     ./config/fantomcat/prepare_bed12_lv4_stringent_hg38.yml
#
# Output:
#   FANTOM_CAT.lv4_stringent.hg38.txid.bed

input_bed_file:
  class: File
  format: edam:format_3003
  location: ../../Data/Database/FANTOM/FANTOM-CAT/FANTOM_CAT.lv4_stringent.hg38.bed

output_bed_file_name: "FANTOM_CAT.lv4_stringent.hg38.txid.bed"
