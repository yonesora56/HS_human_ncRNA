#
# Run:
#   cwltool --outdir ./out/ChIP-Atlas_diff/ChIPseq_hsf1/bedfile_intersect_v2/ \
#     ./Workflow/bedtools_intersect_v2_scatter.cwl \
#     ./config/bedtools_intersect/chipatlas_diff_chipseq_hsf1_v2.yml

peaks_bed_file:
