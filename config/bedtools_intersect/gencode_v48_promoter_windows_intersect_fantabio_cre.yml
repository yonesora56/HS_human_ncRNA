# GENCODE v48 promoter windows (BED6) vs. fanta.bio CRE peaks (bedtools intersect -wo)
# Query BED is 0-based half-open, converted from gencode.v48.promoter_windows.gff3
# (promoter_window features are not handled by gffread --bed).
#
# Run:
#   cwltool --outdir ./out/fantabio/bedtools_intersect/ \
#     ./Tools/bedtools_intersect_v2.cwl \
#     ./config/bedtools_intersect/gencode_v48_promoter_windows_intersect_fantabio_cre.yml
#
# Output:
#   gencode.v48.promoter_windows_v260908_intersecting_human-CREv1.2.1.hg38.cre-peaks.bed

query_bed_file:
  class: File
  format: edam:format_3003
  location: ../../Data/Database/GENCODE_v49/metadata/gencode.v48.promoter_windows_v260908.bed

peaks_bed_file:
  class: File
  format: edam:format_3003
  location: ../../Data/Database/fantabio/human-CREv1.2.1.hg38.cre-peaks.bed
