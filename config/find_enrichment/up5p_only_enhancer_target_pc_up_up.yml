# Only enhancer-derived target protein-coding transcript (UP-UP)
target_genelist:
  class: File
  location: ../../out/enrichment_analysis/query/only_enhancer_target_pc/only_enhancer_target_pc_list_up5p_up5p.tsv

background_genelist:
  class: File
  location: ../../out/enrichment_analysis/background/background_quantified_pc_transcript_list.txt

# アノテーションは、この場合はより議論しやすくするため、experimental evidence のみを使用する
annotation_file:
  class: File
  location: ../../out/enrichment_analysis/transcript_go_association/transcript_go_association_exp_evidence.txt

alpha: 0.01
pvalue: 0.01
method: "fdr_bh"
algorithm: "elim"
elim_cutoff: 0.01
pval_field: "uncorrected"


obo_file: 
  class: File
  location: ../../Data/Database/GO/go_release_20260805.obo

obsolete_go: "replace"

output_file_name: "enrichment_analysis_only_enhancer_target_pc_up5p_up5p_elim.tsv"
stdout_file_name: "find_enrichment_stdout_only_enhancer_target_pc_up5p_up5p_elim.txt"