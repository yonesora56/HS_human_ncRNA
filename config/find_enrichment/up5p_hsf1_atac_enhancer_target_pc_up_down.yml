# Diff Analysis (HSF1) + Diff Analysis (ATAC-seq) + enhancer-derived target protein-coding transcript (UP-DOWN)
target_genelist:
  class: File
  location: ../../out/enrichment_analysis/query/diff_analysis_atac_hsf1_enhancer_target_pc/hsf1_atac_enhancer_derived_target_pc_list_up5p_down5p.tsv

background_genelist:
  class: File
  location: ../../out/enrichment_analysis/background/background_quantified_pc_transcript_list.txt

# アノテーションは、この場合は、より議論しやすくするため、experimental evidence のみを使用する
annotation_file:
  class: File
  location: ../../out/enrichment_analysis/transcript_go_association/transcript_go_association_exp_evidence.txt

alpha: 0.01
pvalue: 0.01
method: "fdr_bh"
algorithm: "elim"
elim_cutoff: 0.01
pval_field: "uncorrected"


obo_file: 
  class: File
  location: ../../Data/Database/GO/go_release_20260805.obo

obsolete_go: "replace"

output_file_name: "enrichment_analysis_diff_analysis_atac_hsf1_enhancer_target_pc_up5p_down5p_elim.tsv"
stdout_file_name: "find_enrichment_stdout_diff_analysis_atac_hsf1_enhancer_target_pc_up5p_down5p_elim.txt"